name: verify-and-build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: false
      - run: go vet ./...
      - run: go test ./...
        working-directory: tools/p95-priority-helper/src
      - run: go vet ./...
        working-directory: tools/p95-priority-helper/src
      - run: go test ./...
        env:
          VENTOY_TEST_OUTPUT: ${{ runner.temp }}/ventoy-template-fixtures
      - name: Parse Linux installer templates
        if: runner.os == 'Linux'
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/template-pycache
        run: |
          python3 -m venv "$RUNNER_TEMP/template-validator"
          "$RUNNER_TEMP/template-validator/bin/pip" install --disable-pip-version-check pykickstart==3.78 PyYAML==6.0.3
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_templates.py "$RUNNER_TEMP/ventoy-template-fixtures"
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_pxe.py "$RUNNER_TEMP/ventoy-template-fixtures"
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_raid.py "$RUNNER_TEMP/ventoy-template-fixtures"
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_storage_layouts.py "$RUNNER_TEMP/ventoy-template-fixtures"
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_manual_setup.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_software.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_fyhoc_unlock.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_p95_priority.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_p95_units.py
          sudo "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_node_join.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_setup_prompt.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_root_password.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_ubiquity_resolver.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_manual_preload.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_manual_update.py
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_setup_preload.py "$RUNNER_TEMP/ventoy-template-fixtures"
          "$RUNNER_TEMP/template-validator/bin/python" scripts/validate_unified_menu.py "$RUNNER_TEMP/ventoy-template-fixtures"
          for f in internal/center/assets/manual/*.sh; do bash -n "$f"; done
          for f in tools/p95-priority-helper/*.sh; do bash -n "$f"; done
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: node --check internal/center/web/app.js
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build portable binaries
        run: |
          mkdir -p dist/linux dist/windows
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux/ventoy-center ./cmd/ventoy-center
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows/ventoy-center.exe ./cmd/ventoy-center
          cp -r deploy docs README.md dist/linux/
          cp -r deploy docs README.md dist/windows/
          tar -czf dist/ventoy-center-linux-amd64.tar.gz -C dist/linux .
          (cd dist/windows && zip -qr ../ventoy-center-windows-amd64.zip .)
          cd dist
          sha256sum ventoy-center-linux-amd64.tar.gz ventoy-center-windows-amd64.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ventoy-center-packages
          path: |
            dist/ventoy-center-linux-amd64.tar.gz
            dist/ventoy-center-windows-amd64.zip
            dist/SHA256SUMS
  linux-update-policy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, debian:12, rockylinux/rockylinux:8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./internal/center -run TestEveryProfileProducesInstallationBundle
        env:
          VENTOY_TEST_OUTPUT: ${{ runner.temp }}/policy-fixtures
      - name: Exercise real package managers in disposable containers
        env:
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/scripts:/tests:ro" \
            -v "$PWD/internal/center/assets/manual/software.py:/software.py:ro" \
            -v "$RUNNER_TEMP/policy-fixtures/ubuntu-22.04/uefi/linux-update-policy.sh:/policy.sh:ro" \
            "$TARGET_IMAGE" sh -ec '
              if command -v apt-get >/dev/null; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 systemd
              else
                dnf -y install python3 rpm-build createrepo_c
              fi
              mkdir -p /run
              touch /run/ventoy-policy-disposable-root
              sh /tests/seed_policy_test_kernel.sh
              python3 /tests/validate_update_policy.py /policy.sh
              python3 /tests/validate_software.py --native /software.py
              python3 /tests/validate_package_retention.py /software.py --policy /policy.sh
            '
  linux-startup:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [rockylinux/rockylinux:8, rockylinux/rockylinux:9, rockylinux/rockylinux:10, debian:12, debian:13, ubuntu:24.04, ubuntu:26.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          cache: false
      - run: CGO_ENABLED=0 go build -trimpath -o dist/ventoy-center ./cmd/ventoy-center
      - name: Verify binary startup in target userland
        env:
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/app:ro" "$TARGET_IMAGE" sh -ec '
            /app/ventoy-center version
            /app/ventoy-center init --dir /tmp/ventoy-test
            /app/ventoy-center serve --config /tmp/ventoy-test/config.json &
            pid=$!
            sleep 2
            kill -0 "$pid"
            kill -TERM "$pid"
            wait "$pid"
          '
