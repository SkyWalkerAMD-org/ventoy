# {{.Target.Label}}: credentials and a real target disk are fetched only after inventory checks.
d-i auto-install/enable boolean true
d-i debconf/priority string critical
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vc-pxe
d-i netcfg/hostname string vc-pxe
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string {{.Target.Suite}}
{{if or .Target.Archived .OfflineMedia}}d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
{{end}}
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true
# user-setup-ask runs before disk detection. Locked placeholders suppress its
# questions; the authenticated response replaces them before user-setup-apply.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Pending automatic installation
d-i passwd/username string vcinstall
d-i passwd/user-password-crypted password *
d-i passwd/user-default-groups string sudo
d-i partman-auto/disk string /dev/ventoy-center-not-authorized
d-i grub-installer/bootdev string /dev/ventoy-center-not-authorized
d-i partman/early_command string \
    umask 077; {{if or (eq .Target.ID "debian-10") (eq .Target.ID "debian-11")}}{{printfb .PXECommand}}{{else}}printf '%s' {{sh (b64 .PXECommand)}} | base64 -d{{end}} > /tmp/ventoy-center-menu.sh && \
    sh /tmp/ventoy-center-menu.sh > /var/log/ventoy-center-menu.log 2>&1 || { while :; do sleep 60; done; }
