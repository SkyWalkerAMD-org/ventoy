# {{.Target.Label}} / {{.Target.ID}} — one authorized machine only.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string {{.Machine.Name}}
d-i netcfg/hostname string {{.Machine.Name}}
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string {{.Target.Suite}}
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string {{.Request.Username}}
d-i passwd/username string {{.Request.Username}}
d-i passwd/user-password-crypted password {{.Request.PasswordHash}}
d-i passwd/user-default-groups string audio cdrom video sudo
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# An invalid disk is deliberate. Only the guarded partman hook changes this.
d-i partman-auto/disk string /dev/ventoy-center-not-authorized
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean false
d-i partman-md/device_remove_md boolean false
d-i partman/early_command string \
    umask 077; printf '%s' {{sh (b64 .Guard)}} | base64 -d > /tmp/ventoy-center-guard.sh && \
    sh /tmp/ventoy-center-guard.sh > /var/log/ventoy-center-guard.log 2>&1 || { while :; do sleep 60; done; }

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/ventoy-center-not-authorized
d-i preseed/late_command string \
    umask 077; printf '%s' {{sh (b64 .DebianLate)}} | base64 -d > /target/root/ventoy-center-late.sh && \
    in-target /bin/sh /root/ventoy-center-late.sh && rm -f /target/root/ventoy-center-late.sh
d-i finish-install/reboot_in_progress note
