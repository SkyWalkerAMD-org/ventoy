# {{.Target.Label}}; a guarded launcher loads this after binding the target disk.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us
d-i netcfg/get_hostname string {{.Machine.Name}}
d-i netcfg/hostname string {{.Machine.Name}}
d-i netcfg/get_domain string local
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i passwd/user-fullname string Administrator
d-i passwd/username string {{if eq .Request.Username "admin"}}vcinstall{{else}}{{.Request.Username}}{{end}}
d-i passwd/user-password-crypted password {{.Request.PasswordHash}}
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i partman-auto/disk string /dev/ventoy-center-unverified
d-i grub-installer/bootdev string /dev/ventoy-center-unverified
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean false
d-i partman-md/device_remove_md boolean false
ubiquity ubiquity/early_command string true
ubiquity ubiquity/reboot boolean false
ubiquity ubiquity/summary note
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/minimal_install boolean false
ubiquity ubiquity/success_command string \
    umask 077; printf '%s' {{sh (b64gz .UbiquityLate)}} | base64 -d | gzip -dc > /tmp/ventoy-center-desktop-late.sh && \
    sh /tmp/ventoy-center-desktop-late.sh
