# Generated for exactly one authorized machine. Do not reuse this file.
# Profile: {{.Target.ID}} / {{.Target.Label}}
text
{{if or (eq .Target.ID "centos-7.6") (eq .Target.ID "centos-7.9") (eq .Target.ID "rhel-7")}}install
{{end}}cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
{{if or (eq .Target.ID "centos-7.6") (eq .Target.ID "centos-7.9") (eq .Target.ID "rhel-7") (eq .Target.Version "8") (eq .Target.Version "8.0") (eq .Target.Version "8.4") (eq .Target.Version "8.5") (eq .Target.ID "rocky-9") (eq .Target.ID "almalinux-9") (eq .Target.ID "rhel-9")}}# iVentoy brings up the PXE NIC. Keep the early Kickstart parser from
# pinning its pre-udev ethN name; configure the MAC in Anaconda instead.
network --hostname={{.Machine.Name}}
{{if or (eq .Target.ID "centos-7.6") (eq .Target.ID "centos-7.9") (eq .Target.ID "rhel-7")}}# EL7 creates the persistent DHCP profile without replacing the live PXE
# connection. Reactivation drops its address and stalls the iSCSI installer.
network --bootproto=dhcp --device={{.Machine.MAC}} --bindto=mac --no-activate --onboot=yes
{{else}}network --bootproto=dhcp --device={{.Machine.MAC}} --bindto=mac --activate
{{end}}
{{else}}network --bootproto=dhcp --device={{.Machine.MAC}} --activate --hostname={{.Machine.Name}}
{{end}}{{if .Request.RootPasswordHash}}rootpw --iscrypted {{.Request.RootPasswordHash}}
{{else}}rootpw --lock
{{end}}
user --name={{.Request.Username}} --groups=wheel --iscrypted --password={{.Request.PasswordHash}}
{{if .Request.SSHKey}}sshkey --username={{.Request.Username}} {{sh .Request.SSHKey}}
{{end}}firewall --enabled --service=ssh
selinux --enforcing
firstboot --disable
eula --agreed
%include /tmp/ventoy-center-partition.ks
{{if not .Request.StoragePlan}}autopart --type=lvm
{{end}}
reboot

%packages
{{if or (eq .Target.ID "centos-7.6") (eq .Target.ID "centos-7.9")}}@^minimal
@core
{{else if eq .Target.ID "rhel-7"}}@core
{{else}}@^minimal-environment
{{end}}curl
openssh-server
sudo
{{if .RAIDSetup}}mdadm
lvm2
{{end}}
{{if or (eq .Target.ID "centos-7.6") (eq .Target.ID "centos-7.9") (eq .Target.ID "rhel-7")}}python
{{else}}python3
{{end}}
%end

{{if not .PXEEntryID}}%pre --interpreter=/bin/bash --erroronfail --log=/tmp/ventoy-center-pre.log
{{.Guard}}
{{if .StorageRecipe}}{{.StorageRecipe}}{{else}}printf 'ignoredisk --only-use=%s\nclearpart --all --initlabel --drives=%s\nbootloader --boot-drive=%s\n' "$disk" "$disk" "$disk" > /tmp/ventoy-center-partition.ks
{{end}}
%end
{{end}}

%post --interpreter=/bin/bash --erroronfail --log=/root/ventoy-center-post.log
set -eu
umask 077
{{.FailureShell}}
trap 'vc_result=$?; [ "$vc_result" = 0 ] || vc_install_failed' EXIT
{{if .RAIDSetup}}printf '%s' {{sh (b64 .RAIDSetup)}} | base64 -d > /usr/local/sbin/ventoy-center-raid
chmod 0700 /usr/local/sbin/ventoy-center-raid
/bin/bash /usr/local/sbin/ventoy-center-raid --apply
{{end}}
{{if .SSHPolicy}}printf '%s' {{sh (b64 .SSHPolicy)}} | base64 -d > /usr/local/sbin/ventoy-center-root-ssh
chmod 0700 /usr/local/sbin/ventoy-center-root-ssh
/bin/sh /usr/local/sbin/ventoy-center-root-ssh --apply
{{end}}
printf '%s' {{sh (b64 .ServerInit)}} | base64 -d > /usr/local/sbin/safe-server-init
chmod 0755 /usr/local/sbin/safe-server-init
printf '%s' {{sh (b64 .UpdatePolicy)}} | base64 -d > /usr/local/sbin/ventoy-center-update-policy
chmod 0700 /usr/local/sbin/ventoy-center-update-policy
/bin/sh /usr/local/sbin/ventoy-center-update-policy --apply --offline
systemctl set-default multi-user.target
{{if .NetworkKeyfiles}}# Only change installed profiles, never the live installer's network.
python3 - /etc/NetworkManager/system-connections <<'VCNETWORK'
{{.NetworkKeyfiles}}
VCNETWORK
{{end}}printf '%s' {{sh (b64 .Bootstrap)}} | base64 -d > /usr/local/sbin/ventoy-center-bootstrap
chmod 0700 /usr/local/sbin/ventoy-center-bootstrap
cat > /etc/systemd/system/ventoy-center-bootstrap.service <<'VCUNIT'
[Unit]
Description=Ventoy Center installation handoff
Wants=network-online.target
After=network-online.target
ConditionPathExists=/usr/local/sbin/ventoy-center-bootstrap
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/ventoy-center-bootstrap
TimeoutStartSec=30min
UMask=0077
[Install]
WantedBy=multi-user.target
VCUNIT
systemctl enable ventoy-center-bootstrap.service
%end
