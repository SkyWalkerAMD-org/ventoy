# Generated for exactly one authorized machine. Do not reuse this file.
# Profile: {{.Target.ID}} / {{.Target.Label}}
text
{{if eq .Target.ID "centos-7.9"}}install
{{end}}cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc
{{if or (eq .Target.ID "centos-7.9") (eq .Target.ID "centos-8.5") (eq .Target.ID "rocky-8") (eq .Target.ID "rocky-9")}}# iVentoy brings up the PXE NIC. Keep the early Kickstart parser from
# pinning its pre-udev ethN name; configure the MAC in Anaconda instead.
network --hostname={{.Machine.Name}}
network --bootproto=dhcp --device={{.Machine.MAC}} --bindto=mac --activate
{{else}}network --bootproto=dhcp --device={{.Machine.MAC}} --activate --hostname={{.Machine.Name}}
{{end}}rootpw --lock
user --name={{.Request.Username}} --groups=wheel --iscrypted --password={{.Request.PasswordHash}}
{{if .Request.SSHKey}}sshkey --username={{.Request.Username}} {{sh .Request.SSHKey}}
{{end}}firewall --enabled --service=ssh
selinux --enforcing
firstboot --disable
eula --agreed
%include /tmp/ventoy-center-partition.ks
autopart --type=lvm
reboot

%packages
{{if eq .Target.ID "centos-7.9"}}@^minimal
@core
{{else}}@^minimal-environment
{{end}}curl
openssh-server
sudo
%end

%pre --interpreter=/bin/bash --erroronfail --log=/tmp/ventoy-center-pre.log
{{.Guard}}
printf 'ignoredisk --only-use=%s\nclearpart --all --initlabel --drives=%s\nbootloader --boot-drive=%s\n' "$disk" "$disk" "$disk" > /tmp/ventoy-center-partition.ks
%end

%post --interpreter=/bin/bash --erroronfail --log=/root/ventoy-center-post.log
set -eu
umask 077
{{if .NetworkKeyfiles}}# Only change installed profiles, never the live installer's network.
python3 - /etc/NetworkManager/system-connections <<'VCNETWORK'
{{.NetworkKeyfiles}}
VCNETWORK
{{end}}printf '%s' {{sh (b64 .Bootstrap)}} | base64 -d > /usr/local/sbin/ventoy-center-bootstrap
chmod 0700 /usr/local/sbin/ventoy-center-bootstrap
cat > /etc/systemd/system/ventoy-center-bootstrap.service <<'VCUNIT'
[Unit]
Description=Ventoy Center installation handoff
Wants=network-online.target
After=network-online.target
ConditionPathExists=/usr/local/sbin/ventoy-center-bootstrap
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/ventoy-center-bootstrap
TimeoutStartSec=30min
UMask=0077
[Install]
WantedBy=multi-user.target
VCUNIT
systemctl enable ventoy-center-bootstrap.service
%end
