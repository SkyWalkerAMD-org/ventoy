# Resolve the single internal disk or an already authorized target before partitioning.
%pre --interpreter=/bin/bash --erroronfail --log=/tmp/ventoy-center-menu.log
set -eu
umask 077
export PYTHONIOENCODING=utf-8
if command -v python3 >/dev/null; then vc_python=python3
elif [ -x /usr/libexec/platform-python ]; then vc_python=/usr/libexec/platform-python
else vc_python=python; fi
"$vc_python" -c {{sh .PXECommand}}
%end
%include /tmp/ventoy-center-selected.ks
